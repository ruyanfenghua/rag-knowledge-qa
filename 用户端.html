<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问答 · 云策</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/vendor/antd.min.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html,body{height:100%;}
  body{display:flex;flex-direction:column;background:var(--bg-page);}

  .top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 24px;
    background:var(--bg);border-bottom:1px solid var(--line-2);}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text);}
  .brand svg{color:var(--brand);}
  .top .back{margin-left:auto;font-size:13px;color:var(--text-2);text-decoration:none;}
  .top .back:hover{color:var(--brand);}

  .main{flex:1;min-height:0;display:flex;justify-content:center;padding:24px;}
  .chat{width:100%;max-width:760px;background:var(--bg);border:1px solid var(--line-2);
    border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden;}

  .chat .hd{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 20px;
    border-bottom:1px solid var(--line-2);}
  .chat .hd .av{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--brand-bg);
    color:var(--brand);display:flex;align-items:center;justify-content:center;}
  .chat .hd b{display:block;font-size:14px;font-weight:600;color:var(--text);line-height:1.3;}
  .chat .hd i{display:block;font-style:normal;font-size:12px;color:var(--text-3);line-height:1.3;}

  .chat #thread{flex:1;min-height:0;background:var(--bg-page);}

  .bar{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line-2);background:var(--bg);}
  .bar .ant-input{flex:1;height:36px;}
  .bar .ant-btn{height:36px;}

  @media (max-width:820px){
    .main{padding:0;}
    .chat{border:0;border-radius:0;}
  }
</style>
</head>
<body data-view="client">

<header class="top">
  <span class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L4 20.5l1.3-4A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
    云策
  </span>
  <a class="back" href="/">返回首页</a>
</header>

<div class="main">
  <div class="chat">
    <div class="hd">
      <span class="av" id="peer-av">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M9 13v2M15 13v2"/></svg>
      </span>
      <span>
        <b id="peer-name">小云</b>
        <i id="peer-sub">在，问吧</i>
      </span>
    </div>
    <div id="thread"></div>
    <div class="bar">
      <input id="q" class="ant-input" placeholder="写下问题，按回车" onkeydown="if(event.key==='Enter')run()">
      <button id="btn" class="ant-btn ant-btn-primary" onclick="run()">发出</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
